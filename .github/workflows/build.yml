name: Build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package
        run: chmod +x mvnw && ./mvnw -B -DskipTests package
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: smartfood-war
          path: target/SmartFood-1.0-SNAPSHOT.war
          if-no-files-found: error

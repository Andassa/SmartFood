services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartfood
      POSTGRES_USER: smartfood
      POSTGRES_PASSWORD: smartfood
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartfood -d smartfood"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: smartfood
      POSTGRES_USER: smartfood
      POSTGRES_PASSWORD: smartfood
    ports:
      - "8080:8080"
